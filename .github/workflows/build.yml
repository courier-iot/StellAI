name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the signed APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download wake word models (openWakeWord v0.5.1)
        run: |
          dir=app/src/main/assets/wakeword
          mkdir -p "$dir"
          base=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx alexa_v0.1.onnx hey_mycroft_v0.1.onnx; do
            curl -fsSL --retry 3 -o "$dir/$f" "$base/$f"
          done
          ls -la "$dir"

      # The app's own tests (app/src/test): if any fail, nothing is built or released
      - name: Run app tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stellai-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # On main: a signed APK, published as the release "vX.Y.Z" (from versionName), which the app store reads.
      # Secrets in THIS repo (Settings > Secrets and variables > Actions), the same names as Stellar Disc:
      #   SIGNING_KEYSTORE_BASE64 (or SIGNING_KEY_BASE64), SIGNING_KEY_PASSWORD, SIGNING_KEY_ALIAS,
      #   SIGNING_STORE_PASSWORD (optional: the key password is used when it's missing)
      - name: Build signed release APK
        id: release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          KEY_TEXT="${SIGNING_KEYSTORE_BASE64:-$SIGNING_KEY_BASE64}"
          missing=""
          [ -z "$KEY_TEXT" ] && missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -z "$SIGNING_KEY_PASSWORD" ] && missing="$missing SIGNING_KEY_PASSWORD"
          [ -z "$SIGNING_KEY_ALIAS" ] && missing="$missing SIGNING_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::No release: this repo is missing the secret(s)$missing. Add them under Settings > Secrets and variables > Actions of courier-iot/StellAI (secrets don't carry over from other repos), then re-run this job."
            exit 1
          fi
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEY_TEXT" | tr -d ' \r\n' | base64 --decode > "$SIGNING_KEYSTORE_FILE"
          export SIGNING_STORE_PASSWORD="${SIGNING_STORE_PASSWORD:-$SIGNING_KEY_PASSWORD}"
          gradle assembleRelease --no-daemon --stacktrace
          ver=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "stellai-v$ver.apk"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # same version uploaded again: replace the APK in its release
            gh release upload "v$VER" "stellai-v$VER.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VER" "stellai-v$VER.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v$VER" --notes ""
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
